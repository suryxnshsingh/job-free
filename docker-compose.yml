version: '3.8'

services:
  # =================================================================
  # DATABASE SERVICES
  # =================================================================
  postgres:
    image: postgres:15-alpine
    container_name: freelance-postgres
    environment:
      POSTGRES_DB: freelance_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    networks:
      - freelance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =================================================================
  # CACHE SERVICES
  # =================================================================
  redis:
    image: redis:7-alpine
    container_name: freelance-redis
    command: redis-server --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./backend/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - freelance-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # =================================================================
  # BLOCKCHAIN SERVICES
  # =================================================================
  hardhat-node:
    build:
      context: ./contracts
      dockerfile: Dockerfile
    container_name: freelance-hardhat
    ports:
      - "8545:8545"
    volumes:
      - ./contracts:/app
      - hardhat_data:/app/artifacts
    networks:
      - freelance-network
    environment:
      - NODE_ENV=development
    command: npx hardhat node --hostname 0.0.0.0
    restart: unless-stopped

  # =================================================================
  # BACKEND API SERVICE
  # =================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: freelance-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/freelance_platform
      - REDIS_URL=redis://:redis_password@redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-for-development
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key-for-development
      - ETHEREUM_RPC_URL=http://hardhat-node:8545
      - IPFS_URL=http://ipfs:5001
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
    networks:
      - freelance-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hardhat-node:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # =================================================================
  # FRONTEND SERVICE
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: freelance-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
      - NEXT_PUBLIC_WS_URL=http://localhost:5000
      - NEXT_PUBLIC_ETHEREUM_RPC_URL=http://localhost:8545
      - NEXT_PUBLIC_IPFS_GATEWAY=http://localhost:8080/ipfs
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./frontend/.next:/app/.next
    networks:
      - freelance-network
    depends_on:
      - backend
    restart: unless-stopped

  # =================================================================
  # IPFS SERVICE
  # =================================================================
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: freelance-ipfs
    ports:
      - "4001:4001"  # P2P port
      - "5001:5001"  # API port
      - "8080:8080"  # Gateway port
    volumes:
      - ipfs_data:/data/ipfs
      - ./ipfs/config:/container-init.d
    networks:
      - freelance-network
    environment:
      - IPFS_PROFILE=server
    restart: unless-stopped

  # =================================================================
  # MONITORING SERVICES
  # =================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: freelance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - freelance-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: freelance-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - freelance-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

  # =================================================================
  # REVERSE PROXY (NGINX)
  # =================================================================
  nginx:
    image: nginx:alpine
    container_name: freelance-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    networks:
      - freelance-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # =================================================================
  # TESTING SERVICES
  # =================================================================
  test-db:
    image: postgres:15-alpine
    container_name: freelance-test-db
    environment:
      POSTGRES_DB: test_freelance_platform
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
    networks:
      - freelance-network
    profiles:
      - testing

  test-redis:
    image: redis:7-alpine
    container_name: freelance-test-redis
    ports:
      - "6380:6379"
    volumes:
      - test_redis_data:/data
    networks:
      - freelance-network
    profiles:
      - testing

# =================================================================
# VOLUMES
# =================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ipfs_data:
    driver: local
  hardhat_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  test_db_data:
    driver: local
  test_redis_data:
    driver: local

# =================================================================
# NETWORKS
# =================================================================
networks:
  freelance-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16